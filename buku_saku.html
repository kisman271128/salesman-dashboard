<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buku Saku ITG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<style>
  :root {
    --navy:   #0f2057;
    --blue:   #1d3a8a;
    --accent: #e8392a;
    --gold:   #f59e0b;
    --teal:   #0ea5e9;
    --green:  #22c55e;
    --bg:     #f1f5f9;
    --card:   #ffffff;
    --text:   #1e293b;
    --muted:  #64748b;
    --border: #e2e8f0;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }

  /* ── APP SHELL: wraps top-bar + content-row so wide screens can frame it as a
       centered "pocket book" card while keeping the same vertical flow as mobile ── */
  .app-shell { display:flex; flex-direction:column; flex:1; min-height:0; width:100%; }

  /* ── LAYOUT: content-row holds sidebar (search+outlet list) + main-content (detail) ── */
  .content-row { display:flex; flex-direction:column; flex:1; min-height:0; }
  .sidebar { display:flex; flex-direction:column; min-height:0; }
  .main-content { display:flex; flex-direction:column; min-height:0; }

  /* ── TOP BAR ── */
  .top-bar {
    background:var(--navy); padding:13px 16px;
    display:flex; align-items:center; justify-content:space-between;
    position:sticky; top:0; z-index:100; flex-shrink:0;
  }
  .top-bar-left { display:flex; align-items:center; gap:10px; }
  .top-bar-icon { width:32px; height:32px; background:var(--accent); border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:15px; }
  .top-bar-title { color:white; font-size:13px; font-weight:700; }
  .top-bar-sub   { color:rgba(255,255,255,0.45); font-size:10px; margin-top:1px; }
  .top-bar-badge { background:var(--gold); color:#000; font-size:11px; font-weight:800; padding:3px 10px; border-radius:20px; white-space:nowrap; }
  .top-bar-right { display:flex; align-items:center; gap:8px; }
  .reward-btn { background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); color:white; font-size:10px; font-weight:700; padding:4px 10px; border-radius:20px; cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .reward-btn:hover { background:rgba(255,255,255,.22); }
  .tablet-toggle { display:flex; align-items:center; gap:4px; color:white; font-size:10px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .tablet-toggle input { accent-color:var(--gold); cursor:pointer; width:14px; height:14px; margin:0; }

  /* ── SEARCH BAR ── */
  .search-bar { background:var(--blue); padding:9px 12px; display:flex; gap:7px; align-items:center; }
  .search-input {
    flex:1; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
    border-radius:8px; padding:7px 11px; color:white; font-size:12px; outline:none;
  }
  .search-input::placeholder { color:rgba(255,255,255,0.45); }
  /* Combobox daftar toko — pengganti kolom pencarian teks */
  .search-select {
    flex:1; min-width:0; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2);
    border-radius:8px; padding:7px 11px; color:white; font-size:12px; outline:none; cursor:pointer;
  }
  .search-select option { color:#1e293b; background:#fff; }
  .nav-btn {
    background:rgba(255,255,255,0.15); border:none; color:white;
    border-radius:8px; width:30px; height:30px; cursor:pointer; font-size:14px;
    display:flex; align-items:center; justify-content:center; transition:background .2s;
  }
  .nav-btn:hover { background:rgba(255,255,255,0.28); }
  .nav-btn:disabled { opacity:.35; cursor:default; }

  /* ── OUTLET LIST ── */
  .outlet-list { background:white; border-bottom:2px solid var(--border); max-height:150px; overflow-y:auto; }
  .outlet-list::-webkit-scrollbar { width:3px; }
  .outlet-list::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }
  .outlet-item {
    padding:8px 14px; font-size:11px; border-bottom:1px solid #f1f5f9;
    cursor:pointer; display:flex; justify-content:space-between; align-items:center;
    transition:background .15s;
  }
  .outlet-item:hover { background:#f8fafc; }
  .outlet-item.active { background:#eff6ff; color:var(--blue); font-weight:700; }
  .outlet-item-name { font-weight:600; }
  .outlet-item-meta { font-size:9px; color:var(--muted); margin-top:1px; }
  .rank-sm { background:var(--bg); color:var(--muted); font-size:9px; font-weight:700; padding:2px 7px; border-radius:10px; }
  .rank-sm.top5 { background:#fef9c3; color:#854d0e; }
  .rank-sm.top10 { background:#f0fdf4; color:#166534; }

  /* ── DETAIL SCROLL ── */
  .detail-area { overflow-y:auto; }
  .detail-area::-webkit-scrollbar { width:3px; }
  .detail-area::-webkit-scrollbar-thumb { background:#cbd5e1; border-radius:2px; }

  /* ── OUTLET HEADER ── */
  .outlet-header {
    background:linear-gradient(135deg, var(--blue) 0%, var(--navy) 100%);
    padding:14px 16px 12px; position:relative; overflow:hidden;
  }
  .outlet-header::before {
    content:''; position:absolute; right:-20px; top:-20px;
    width:110px; height:110px; border-radius:50%; background:rgba(255,255,255,0.04);
  }
  .oh-rank-badge {
    display:inline-flex; align-items:center; gap:5px;
    background:var(--accent); color:white; font-size:10px; font-weight:700;
    padding:3px 10px; border-radius:20px; margin-bottom:7px;
  }
  .oh-name  { color:white; font-size:15px; font-weight:800; line-height:1.25; }
  .oh-meta  { color:rgba(255,255,255,0.55); font-size:10px; margin-top:4px; }
  .oh-meta span { margin-right:10px; }
  .oh-update { position:absolute; top:12px; right:12px; background:rgba(255,255,255,0.1); color:rgba(255,255,255,0.65); font-size:9px; padding:3px 8px; border-radius:10px; }

  /* ── KPI STRIP ── */
  .kpi-strip { display:grid; grid-template-columns:repeat(4,1fr); background:#0a1840; gap:1px; }
  .kpi-item { padding:9px 6px; text-align:center; background:#0f2057; }
  .kpi-label { color:rgba(255,255,255,0.45); font-size:9px; font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .kpi-value { color:white; font-size:12px; font-weight:800; margin-top:3px; }
  .kpi-value.up { color:#86efac; }
  .kpi-value.dn { color:#fca5a5; }
  .kpi-pct  { font-size:9px; margin-top:2px; color:rgba(255,255,255,0.35); }
  .kpi-pct.up { color:#86efac; }
  .kpi-pct.dn { color:#fca5a5; }

  /* ── ACH BAR ── */
  .ach-wrap { padding:8px 14px; background:#0a1840; }
  .ach-label { color:rgba(255,255,255,0.5); font-size:9px; font-weight:600; display:flex; justify-content:space-between; margin-bottom:4px; }
  .ach-bar-bg { height:6px; background:rgba(255,255,255,0.1); border-radius:3px; overflow:hidden; }
  .ach-bar-fill { height:100%; border-radius:3px; transition:width .5s; }

  /* ── SECTION ── */
  .section { padding:12px 14px 4px; }
  .section-title { display:flex; align-items:center; justify-content:space-between; margin-bottom:9px; }
  .section-title h3 { font-size:11.5px; font-weight:700; color:var(--navy); display:flex; align-items:center; gap:6px; }
  .section-title h3::before { content:''; display:block; width:3px; height:13px; background:var(--accent); border-radius:2px; }
  .section-badge { background:var(--bg); color:var(--muted); font-size:9px; font-weight:600; padding:2px 8px; border-radius:10px; border:1px solid var(--border); }

  /* ── PROGRAM CHIPS ── */
  .prog-grid { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:10px; }
  .prog-dot { width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }

  /* ── PROGRAM TABS ── */
  .prog-tab-bar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .prog-tab {
    padding:5px 12px; border-radius:20px; font-size:10px; font-weight:700;
    border:1.5px solid; cursor:pointer; transition:all .2s; white-space:nowrap;
    display:flex; align-items:center; gap:5px;
  }
  .prog-tab.selected { box-shadow:0 2px 8px rgba(0,0,0,.15); transform:translateY(-1px); }
  .prog-tab-itga   { background:#eff6ff; border-color:#93c5fd; color:#1e40af; }
  .prog-tab-itga.selected   { background:#1e40af; color:white; border-color:#1e40af; }
  .prog-tab-itgsc  { background:#f0fdfa; border-color:#5eead4; color:#115e59; }
  .prog-tab-itgsc.selected  { background:#115e59; color:white; border-color:#115e59; }
  .prog-tab-lclb   { background:#f0fdf4; border-color:#86efac; color:#166534; }
  .prog-tab-lclb.selected   { background:#166534; color:white; border-color:#166534; }
  .prog-tab-clbk   { background:#fef2f2; border-color:#fca5a5; color:#991b1b; }
  .prog-tab-clbk.selected   { background:#991b1b; color:white; border-color:#991b1b; }
  .prog-tab-kantin { background:#faf5ff; border-color:#c4b5fd; color:#6b21a8; }
  .prog-tab-kantin.selected { background:#6b21a8; color:white; border-color:#6b21a8; }
  .prog-tab-other  { background:#fff7ed; border-color:#fdba74; color:#9a3412; }
  .prog-tab-other.selected  { background:#9a3412; color:white; border-color:#9a3412; }

  /* ── PROGRAM DETAIL CARD ── */
  .prog-detail-card {
    background:linear-gradient(135deg,#0f2057,#1d3a8a);
    border-radius:12px; padding:12px 14px; margin-bottom:10px;
  }
  .pdc-header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px; }
  .pdc-label  { color:rgba(255,255,255,.45); font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; margin-bottom:3px; }
  .pdc-name   { color:white; font-size:13px; font-weight:800; }
  .pdc-status { font-size:9px; font-weight:700; padding:3px 9px; border-radius:10px; flex-shrink:0; }
  .sts-active  { background:rgba(134,239,172,.2); color:#86efac; }
  .sts-passive { background:rgba(252,165,165,.2); color:#fca5a5; }
  .pdc-metrics { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-bottom:8px; }
  .pdc-metric { text-align:center; }
  .pdm-label  { color:rgba(255,255,255,.45); font-size:8.5px; font-weight:600; text-transform:uppercase; }
  .pdm-value  { color:white; font-size:12px; font-weight:800; margin-top:2px; }
  .pdm-value.ok   { color:#86efac; }
  .pdm-value.warn { color:#fca5a5; }
  .pdc-ach-row { display:flex; justify-content:space-between; font-size:9px; margin-bottom:3px; }
  .pdc-ach-row span:first-child { color:rgba(255,255,255,.5); }
  .pdc-ach-bg   { height:5px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; margin-bottom:10px; }
  .pdc-ach-fill { height:100%; border-radius:3px; }
  .pdc-period-table { width:100%; border-collapse:collapse; font-size:10px; }
  .pdc-period-table th { background:rgba(0,0,0,.25); color:rgba(255,255,255,.6); padding:5px 8px; text-align:right; font-size:9px; font-weight:600; }
  .pdc-period-table th:first-child { text-align:left; border-radius:5px 0 0 0; }
  .pdc-period-table th:last-child  { border-radius:0 5px 0 0; }
  .pdc-period-table td { padding:5px 8px; text-align:right; border-bottom:1px solid rgba(255,255,255,.07); color:rgba(255,255,255,.85); }
  .pdc-period-table td:first-child { text-align:left; font-weight:600; color:rgba(255,255,255,.7); }
  .pdc-period-table tr:last-child td { border-bottom:none; }


  /* ── MINI BAR ── */
  .mini-bar-wrap { display:flex; align-items:center; gap:4px; }
  .mini-bar-bg   { flex:1; height:4px; background:#e2e8f0; border-radius:2px; overflow:hidden; }
  .mini-bar-fill { height:100%; border-radius:2px; }

  /* ── CHART ── */
  .chart-wrap { background:var(--bg); border-radius:10px; padding:10px; margin-bottom:10px; position:relative; height:240px; }
  .chart-legend { display:flex; gap:10px; margin-bottom:7px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:4px; font-size:9px; color:var(--muted); font-weight:600; }
  .legend-dot  { width:8px; height:8px; border-radius:2px; }

  /* ── METRIC CARDS ROW ── */
  .metric-row { display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:10px; }
  .metric-card { background:var(--bg); border-radius:10px; padding:9px 10px; text-align:center; }
  .mc-label { font-size:9px; color:var(--muted); font-weight:600; text-transform:uppercase; letter-spacing:.4px; }
  .mc-value { font-size:13px; font-weight:800; color:var(--navy); margin-top:3px; }
  .mc-sub   { font-size:9px; color:var(--muted); margin-top:1px; }
  .mc-value.ok { color:#166534; }
  .mc-value.warn { color:#9a3412; }

  /* ── DIVIDER ── */
  .divider { height:6px; background:var(--bg); border-top:1px solid var(--border); border-bottom:1px solid var(--border); }

  /* ── LOADING STATE ── */
  .loading-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px; gap:14px; }
  .spinner { width:36px; height:36px; border:3px solid #e2e8f0; border-top-color:var(--teal); border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading-text { color:var(--muted); font-size:12px; font-weight:600; }
  .error-box { background:#fef2f2; border:1px solid #fca5a5; color:var(--accent); padding:14px; border-radius:10px; margin:16px; font-size:12px; text-align:center; }

  /* ── PLAN SKU TABLE ── */
  .sku-container {
    column-count: 3;
    column-gap: 5px;
    column-fill: balance;
  }
  .sku-group {
    break-inside: avoid;
    display: inline-block;
    width: 100%;
    margin-bottom: 5px;
    vertical-align: top;
  }
  .sku-group-header {
    font-size:10px; font-weight:800; color:white; padding:4px 7px;
    border-radius:4px 4px 0 0; display:flex; justify-content:space-between; align-items:center;
  }
  .sku-tbl { width:100%; border-collapse:collapse; font-size:9px; border:1px solid #e2e8f0; border-top:none; }
  .sku-tbl th { background:#f8fafc; color:var(--muted); padding:3px 5px; text-align:right; font-size:8px; font-weight:700; border-bottom:1px solid var(--border); }
  .sku-tbl th:first-child { text-align:left; }
  .sku-tbl td { padding:2.5px 5px; text-align:right; border-bottom:1px solid #f8fafc; line-height:1.3; }
  .sku-tbl td:first-child { text-align:left; font-weight:600; font-family:monospace; font-size:8.5px; color:#334155; }
  .sku-tbl tr:last-child td { border-bottom:none; }
  .sku-ok   { color:#166534; font-weight:700; }
  .sku-warn { color:#dc2626; font-weight:700; }
  .sku-zero { color:#94a3b8; }

  /* ── VISIT NOTE / DIGITAL SIGNATURE ── */
  .visit-note-card { background:white; border:1.5px solid var(--border); border-radius:12px; padding:14px; }
  .vn-label { display:block; font-size:9.5px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; margin:10px 0 5px; }
  .vn-label:first-child { margin-top:0; }
  .vn-textarea {
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:9px 10px;
    font-family:inherit; font-size:12px; color:var(--text); resize:vertical; min-height:160px;
  }
  .vn-textarea:focus, .vn-input:focus { outline:none; border-color:var(--teal); }
  .vn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .vn-input {
    width:100%; border:1.5px solid var(--border); border-radius:8px; padding:8px 10px;
    font-family:inherit; font-size:12px; color:var(--text);
  }
  .sig-wrap {
    position:relative; border:1.5px dashed #cbd5e1; border-radius:8px;
    background:#f8fafc; touch-action:none; overflow:hidden;
  }
  .sig-canvas { display:block; width:100%; height:160px; touch-action:none; cursor:crosshair; }
  .sig-placeholder {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    color:#94a3b8; font-size:11px; font-weight:600; pointer-events:none; text-align:center; width:100%;
  }
  .vn-sig-row { display:flex; gap:10px; }
  .vn-sig-col { flex:1; min-width:0; }
  .vn-sig-name { font-size:10px; font-weight:700; color:var(--text); text-align:center; margin-top:6px; }
  .vn-actions { display:flex; gap:8px; margin-top:12px; }
  .vn-btn {
    flex:1; padding:10px; border-radius:8px; border:none; font-size:11px; font-weight:700;
    cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px; transition:filter .15s;
  }
  .vn-btn:hover { filter:brightness(0.95); }
  .vn-btn:disabled { opacity:.6; cursor:default; filter:none; }
  .vn-btn-ghost   { background:var(--bg); color:var(--muted); border:1.5px solid var(--border); }
  .vn-btn-primary { background:var(--navy); color:white; }
  .vn-saved-hint { font-size:9.5px; color:#166534; margin-top:8px; text-align:center; display:none; }

  /* ── PRINT REPORT (dirender off-screen, dipotret html2canvas → jsPDF saat "Simpan PDF") ──
       Satu halaman ringkas gaya majalah: semua program & section tampil sekaligus,
       disusun dalam 3 kolom berlebar tetap (float, lihat .pr-columns) supaya muat
       dalam 1 halaman lebar tanpa ada yang terpotong saat dipotret html2canvas. ── */
  /* Ditaruh pada koordinat normal (0,0) lewat position:absolute, BUKAN di posisi
     ekstrem (left:-99999px) — offset sejauh itu pernah bikin html2canvas salah
     hitung area yang ditangkap (elemen/kolom di sisi kanan hilang/terpotong).
     Yang menyembunyikannya dari layar adalah wrapper pembungkus height:0;overflow:hidden
     di HTML (lihat <div id="printReportRoot">), bukan offset posisi elemen ini sendiri. */
  #printReportRoot { position:absolute; left:0; top:0; width:1450px; background:#fff; }
  .pr-page { padding:22px; background:#fff; }
  /* Tampilan Tablet/Laptop: majalah lebar di-scroll horizontal */
  .tablet-scroll { overflow-x:auto; background:#fff; }
  .tablet-page { width:1450px; }
  .pr-titlebar { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:14px; }
  .pr-title {
    display:inline-block; background:#dbeafe; border:2px solid var(--blue); color:var(--navy);
    font-size:17px; font-weight:800; padding:7px 18px; border-radius:8px;
  }
  .pr-meta { font-size:10.5px; color:var(--muted); text-align:right; line-height:1.6; }
  .pr-meta b { color:var(--text); }
  /* Kolom eksplisit dengan float + lebar px pasti, dan — penting — SEMUA rata (flat),
     TIDAK bersarang (float di dalam float). Kolom 1 & 2 (profil/program, chart dst)
     terbukti cetak sempurna; yang selalu bermasalah cuma sub-kolom Plan by SKU karena
     sebelumnya sub-kolom itu di-float DI DALAM float kolom-3 — float bersarang seperti
     itu yang bikin html2canvas salah hitung sehingga sub-kolom ke-2/3 kepotong. Sekarang
     ke-5 kolom (2 kolom lebar + 3 sub-kolom SKU) jadi saudara sejajar langsung di bawah
     .pr-columns, tidak ada lagi float bersarang.
     Lebar dihitung dari #printReportRoot = 1450px, padding .pr-page 22px×2 → 1406px isi:
     kolom lebar = 458px (×2 + gap 16px), sub-kolom SKU = 148px (×3 + gap 6px). */
  .pr-columns { overflow:hidden; }
  .pr-col { float:left; width:458px; margin-right:16px; }
  .pr-block { margin-bottom:14px; border-radius:12px; overflow:hidden; box-shadow:0 2px 6px rgba(15,23,42,.08); }
  .pr-block.plain { box-shadow:none; }
  .pr-sku-col { float:left; width:148px; margin-right:6px; }
  .pr-sku-col:last-child { margin-right:0; }
  /* Lebar kolom tabel SKU dipatok (bukan auto) supaya tidak pernah lebih lebar dari
     148px sub-kolomnya — cuma berlaku di laporan cetak, panel "Plan by SKU" langsung
     di aplikasi tetap pakai .sku-container aslinya (table-layout:auto). */
  .pr-sku-col .sku-tbl { table-layout:fixed; }
  .pr-sku-col .sku-tbl th:first-child, .pr-sku-col .sku-tbl td:first-child { width:46%; }
  .pr-sku-col .sku-tbl th:not(:first-child), .pr-sku-col .sku-tbl td:not(:first-child) { width:27%; }
  .pr-section-label {
    font-size:11px; font-weight:800; color:var(--navy); display:flex; align-items:center; gap:6px;
    margin-bottom:8px;
  }

<script>
// ── Error validator: tampil di layar & relay ke parent console ──
window.onerror = function(msg, src, line, col, err) {
  const box = document.getElementById('loadingState');
  if (box) box.innerHTML = `
    <div style="background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:14px 16px;border-radius:10px;margin:16px;font-size:11px;text-align:left;width:90%;">
      <b style="font-size:13px;">❌ JS Error</b><br><br>
      <b>Pesan:</b> ${msg}<br>
      <b>File:</b> ${src}<br>
      <b>Baris:</b> ${line}:${col}
    </div>`;
  // relay ke parent agar muncul di console utama
  try { window.parent.console.error('[BukuSaku]', msg, src, line, col); } catch(e) {}
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  const msg = e.reason?.message || String(e.reason);
  const box = document.getElementById('loadingState');
  if (box) box.innerHTML = `
    <div style="background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:14px 16px;border-radius:10px;margin:16px;font-size:11px;text-align:left;width:90%;">
      <b style="font-size:13px;">❌ Promise Error</b><br><br>
      ${msg}<br><br>
      <button onclick="location.reload()" style="padding:5px 14px;background:#1d3a8a;color:white;border:none;border-radius:7px;cursor:pointer;font-size:11px;">🔄 Reload</button>
    </div>`;
  try { window.parent.console.error('[BukuSaku] Unhandled:', msg); } catch(e) {}
});
</script>
<script>
// ── Global State ──
let allOutlets      = [];
let filteredOutlets = [];
let currentIdx      = 0;
let trendChart      = null;
let skupelMap       = {};
let rewardMap       = {}; // { [itg]: { pct, periode } } — global, berlaku untuk semua outlet
const REWARD_STORAGE_KEY = 'bukuSaku_rewards';
const ITG_SC_RATE = 17748; // rate rupiah per unit (cs/dus) khusus ITG SC — user menulis "17.748" (17 ribu 748)

function loadRewardMap() {
  try { rewardMap = JSON.parse(localStorage.getItem(REWARD_STORAGE_KEY) || '{}') || {}; }
  catch(e) { rewardMap = {}; }
}
function saveRewardMap() {
  try { localStorage.setItem(REWARD_STORAGE_KEY, JSON.stringify(rewardMap)); }
  catch(e) {}
}

// ── Mode Tampilan (Mobile vs Tablet/Laptop) + penyimpanan tanda tangan ──
let tabletMode = false;
const TABLET_MODE_KEY = 'bukuSaku_tabletMode';
let sigOwnerData = null;   // dataURL TTD Owner Toko agar tidak hilang saat ganti mode/outlet
let sigPetugasData = null; // dataURL TTD Petugas/Branch Head

function loadTabletMode() {
  try { tabletMode = localStorage.getItem(TABLET_MODE_KEY) === '1'; }
  catch(e) { tabletMode = false; }
  const cb = document.getElementById('tabletModeCheck');
  if (cb) cb.checked = tabletMode;
  document.body.classList.toggle('tablet-mode', tabletMode);
}
function saveTabletMode() {
  try { localStorage.setItem(TABLET_MODE_KEY, tabletMode ? '1' : '0'); } catch(e) {}
}
function toggleTabletMode(checked) {
  tabletMode = !!checked;
  saveTabletMode();
  document.body.classList.toggle('tablet-mode', tabletMode);
  if (filteredOutlets[currentIdx]) selectOutlet(currentIdx);
}

const MONTHS = ['','Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const TODAY     = new Date();
const CUR_MONTH = TODAY.getMonth() + 1;
const MTD_LABEL = 'MTD';
const M3_LABEL  = 'M3';
const M2_LABEL  = 'M2';
const M1_LABEL  = 'M1';

// ── Formatters ──
function fmtRp(v) {
  const n = Math.abs(parseFloat(v)||0);
  if (n >= 1e9) return (n/1e9).toFixed(1)+'M';
  if (n >= 1e6) return (n/1e6).toFixed(1)+'jt';
  if (n >= 1e3) return (n/1e3).toFixed(0)+'rb';
  return Math.round(n).toString();
}
// Unit formatter for ITG SC (cs/dus) — show exact number with thousand separator
function fmtUnit(v) {
  const n = parseFloat(v)||0;
  return Math.round(n).toLocaleString('id-ID');
}
function fmtPct(a,t) { if (!t||t===0) return a>0?'100%':'0%'; return Math.round((a/t)*100)+'%'; }
function pctNum(a,t) { if (!t||t===0) return a>0?100:0; return Math.round((a/t)*100); }
function escapeHtml(s) {
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// "Petugas" pada Catatan Kunjungan/TTD = orang yang login ke aplikasi (bukan salesman
// outlet-nya) — admin ditampilkan sebagai "Branch Head", selain itu pakai nama loginnya.
function getPetugasName() {
  try {
    const currentUser = (sessionStorage.getItem('currentUser') || '').trim();
    const storedRole  = (sessionStorage.getItem('userRole')    || '').trim().toLowerCase();
    const userName    = (sessionStorage.getItem('userName')    || '').trim();
    const isAdmin = storedRole === 'admin' || currentUser.toLowerCase() === 'admin';
    if (isAdmin) return 'Branch Head';
    return userName || currentUser || '';
  } catch(e) {
    return '';
  }
}

// ── Cloudflare Worker Config ──
const WORKER_URL = 'https://depo-tanjung-api.kisman-pidu.workers.dev';

async function cfFetch(namespace) {
  const token = sessionStorage.getItem('cfToken');
  const resp = await fetch(`${WORKER_URL}/data/${namespace}`, {
    headers: token ? { 'Authorization': `Bearer ${token}` } : {}
  });
  if (!resp.ok) throw new Error(`cfFetch ${namespace} → ${resp.status}`);
  const json = await resp.json();
  return json.data;
}

async function initApp() {
  console.log('🚀 BukuSaku initApp start');
  document.getElementById('loadingState').style.display = 'flex';
  document.getElementById('detailArea').style.display   = 'none';

  try {
    console.log('📂 Loading d.details & d.project from CF KV...');
    const [details, projects] = await Promise.all([
      cfFetch('d.details'),
      cfFetch('d.project'),
    ]);
    console.log('📊 Loaded — details:', details.length, 'records | projects:', projects.length, 'records');

    // ── Numeric fields to SUM across salesmen ──
    const SUM_FIELDS = [
      '3LM','T.MTD','A.MTD','LY','LM','LMALL','Max','BE MTD','Gap MTD',
      'T.GPPJ','A.GPPJ','T.GEN','A.GEN','T.GBS','A.GBS','T.MBR','A.MBR',
      'TPOM','CAPOM','PICOS','TMSS','AMSS','CA MTD','SasaranGO','AGO',
    ];

    // ── Group d.details.json by Nama Pelanggan ──
    const grouped = {};
    details.forEach(d => {
      const nama = d['Nama Pelanggan'].trim();
      if (!grouped[nama]) {
        // First record: copy all, init salesman list
        grouped[nama] = { ...d, _salesmen: [d['szname']] };
      } else {
        // Sum numeric fields
        SUM_FIELDS.forEach(f => {
          grouped[nama][f] = (parseFloat(grouped[nama][f]||0) + parseFloat(d[f]||0));
        });
        // Collect unique salesmen
        if (!grouped[nama]._salesmen.includes(d['szname'])) {
          grouped[nama]._salesmen.push(d['szname']);
        }
      }
    });
    // Recalculate Gap MTD after summing
    Object.values(grouped).forEach(d => {
      d['Gap MTD'] = parseFloat(d['A.MTD']||0) - parseFloat(d['T.MTD']||0);
    });

    // ── projectMap keyed by Nama Pelanggan only ──
    const projectMap = {};
    projects.forEach(p => {
      const k = p['CUST NAME'].trim();
      if (!projectMap[k]) projectMap[k] = [];
      projectMap[k].push(p);
    });

    // ── Sort grouped outlets by T.MTD desc, take top 30 ──
    console.log('🔢 Grouped outlets:', Object.keys(grouped).length);
    const top30 = Object.values(grouped)
      .sort((a,b) => parseFloat(b['T.MTD']||0) - parseFloat(a['T.MTD']||0))
      .slice(0, 30);

    allOutlets = top30.map((d, i) => {
      const nama = d['Nama Pelanggan'].trim();
      const pArr = projectMap[nama] || [];
      const salesmen = d._salesmen || [d['szname']||''];
      return {
        rank:    i + 1,
        nama,
        salesman: salesmen.join(' / '),
        jks:     d['Hari JKS']||d['JKS']||'-',
        tMTD:    parseFloat(d['T.MTD']||0),
        aMTD:    parseFloat(d['A.MTD']||0),
        lm:      parseFloat(d['LMALL']||d['LM']||0),
        lm3:     parseFloat(d['3LM']||0),
        ly:      parseFloat(d['LY']||0),
        gapMTD:  parseFloat(d['Gap MTD']||0),
        alamat:       d['Alamat']||'-',
        depo:         d['Depo']||'DEPO TANJUNG',
        channel:      d['Channel Group']||d['CC1']||'-',
        kabupaten:    d['Kabupaten']||'',
        kecamatan:    d['Kecamatan']||'',
        project:      d['Project']||'',
        projectDetail:d['Project Detail']||'',
        tPOM:  parseInt(d['TPOM']||0),  caPOM: parseInt(d['CAPOM']||0),
        picos: parseInt(d['PICOS']||0),
        tmss:  parseInt(d['TMSS']||0),  amss:  parseInt(d['AMSS']||0),
        // chart bars (summed from d.details.json)
        dMax:    parseFloat(d['Max']||0),
        d3LM:    parseFloat(d['3LM']||0),
        dLY:     parseFloat(d['LY']||0),
        dLM:     parseFloat(d['LMALL']||d['LM']||0),
        dTMTD:   parseFloat(d['T.MTD']||0),
        dBEMTD:  parseFloat(d['BE MTD']||0),
        dAMTD:   parseFloat(d['A.MTD']||0),
        dGapMTD: parseFloat(d['Gap MTD']||0),
        // programs from d.project.json (all programs for this outlet)
        projectArr: pArr,
        hasProject: pArr.length > 0,
      };
    });

    filteredOutlets = [...allOutlets];
    buildOutletList();
    populateOutletSelect();
    loadRewardMap();
    loadTabletMode();

    // ── Load d.skupelanggan per-salesman lalu gabungkan (opsional, async) ──
    loadSkupelanggan(details);

    console.log('✅ BukuSaku ready — top30:', allOutlets.length, 'outlets');
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('detailArea').style.display   = 'block';
    selectOutlet(0);

  } catch(err) {
    console.error('initApp error:', err);
    const ls = document.getElementById('loadingState');
    if (ls) ls.innerHTML = `
      <div style="background:#fef2f2;border:1px solid #fca5a5;color:#991b1b;padding:16px;border-radius:10px;margin:16px;font-size:12px;text-align:center;">
        <div style="font-size:24px;margin-bottom:8px;">❌</div>
        <div style="font-weight:700;margin-bottom:4px;">Gagal memuat data</div>
        <div style="opacity:.7;">${err.message}</div>
        <button onclick="initApp()" style="margin-top:12px;padding:6px 16px;background:#1d3a8a;color:white;border:none;border-radius:8px;cursor:pointer;font-size:11px;">🔄 Coba Lagi</button>
      </div>`;
  }
}

// ── Outlet List ──
function buildOutletList(searchTerm='') {
  const list = document.getElementById('outletList');
  const term = searchTerm.toLowerCase().trim();
  const items = term
    ? filteredOutlets.filter(o => o.nama.toLowerCase().includes(term) || o.salesman.toLowerCase().includes(term))
    : filteredOutlets;

  list.innerHTML = items.map((o,i) => `
    <div class="outlet-item${i===currentIdx&&!term?' active':''}" onclick="onOutletClick(${filteredOutlets.indexOf(o)})">
      <div>
        <div class="outlet-item-name">${o.nama}</div>
        <div class="outlet-item-meta">👤 ${o.salesman} · 📅 ${o.jks} · ${fmtRp(o.tMTD)}</div>
      </div>
      <span class="rank-sm${o.rank<=5?' top5':o.rank<=10?' top10':''}">#${o.rank}</span>
    </div>`).join('');
}

// Combobox daftar toko — menggantikan kolom pencarian teks (yang tumpang-tindih
// dengan frame daftar di bawahnya). Isi dropdown = seluruh outlet, pilih langsung
// membuka detail outlet terkait.
function populateOutletSelect() {
  const sel = document.getElementById('outletSelect');
  if (!sel) return;
  sel.innerHTML = '<option value="">🔍 Pilih toko…</option>' +
    filteredOutlets.map((o, i) => `<option value="${i}">${o.nama}</option>`).join('');
  sel.value = String(currentIdx);
}

function onSelectOutlet(val) {
  if (val === '') return;
  const idx = parseInt(val, 10);
  if (!Number.isNaN(idx) && idx >= 0 && idx < filteredOutlets.length) {
    currentIdx = idx;
    buildOutletList();
    selectOutlet(idx);
  }
}

function onOutletClick(idx) {
  const sel = document.getElementById('outletSelect');
  if (sel) sel.value = String(idx);
  currentIdx = idx;
  buildOutletList();
  selectOutlet(idx);
}

function navigateOutlet(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < filteredOutlets.length) {
    currentIdx = next;
    const sel = document.getElementById('outletSelect');
    if (sel) sel.value = String(currentIdx);
    buildOutletList();
    selectOutlet(currentIdx);
    // scroll active item into view
    const items = document.querySelectorAll('.outlet-item');
    if (items[currentIdx]) items[currentIdx].scrollIntoView({block:'nearest'});
  }
}

// ── Reward Program ──
// Reward program umum = % × target (T.MTD bila Periode=MTD, T.Qrt bila QRT).
// Reward ITG SC = target × 17.748 × %  (contoh: 1500 × 17.748 × 1% = 266.220).
function calcRewardValue(prog, cfg) {
  if (!cfg) return null;
  const itg = (prog['ITG'] || '');
  const periode = cfg.periode === 'MTD' ? 'MTD' : 'QRT';
  const target = periode === 'MTD'
    ? parseFloat(prog['T.MTD'] || 0)
    : parseFloat(prog['T.Qrt'] || 0);
  const pct = parseFloat(cfg.pct) || 0;
  if (itg === 'ITG SC') return target * ITG_SC_RATE * (pct / 100);
  return (pct / 100) * target;
}

function buildRewardSummaryHTML(o) {
  const cfg = rewardMap;
  if (!o.hasProject) return '';
  const items = o.projectArr.map((p, i) => {
    const itg = p['ITG'] || ('Program ' + (i + 1));
    const c = cfg[itg];
    if (!c) return null;
    const val = calcRewardValue(p, c);
    if (val === null || !(val > 0)) return null;
    return { itg, val };
  }).filter(Boolean);
  if (!items.length) return '';
  const total = items.reduce((s, it) => s + it.val, 0);
  return `<div class="rw-summary">
    <div class="rw-summary-title">🏆 Reward Program (Perhitungan Estimasi)</div>

// Versi cetak (PDF) dari ringkasan reward — pakai styling laporan (.pr-block).
function buildRewardPrintHTML(o) {
  const cfg = rewardMap;
  if (!o.hasProject) return '';
  const items = o.projectArr.map((p, i) => {
    const itg = p['ITG'] || ('Program ' + (i + 1));
    const c = cfg[itg];
    if (!c) return null;
    const val = calcRewardValue(p, c);
    if (val === null || !(val > 0)) return null;
    return { itg, val };
  }).filter(Boolean);
  if (!items.length) return '';
  const total = items.reduce((s, it) => s + it.val, 0);
  return `<div class="pr-block plain">
    <div class="pr-section-label">🏆 Reward Program (Perhitungan Estimasi)</div>
    <div style="border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;background:#fff;">
      ${items.map(it => `<div style="display:flex;justify-content:space-between;gap:8px;font-size:10px;padding:3px 0;border-bottom:1px dashed #f1f5f9;"><span>${escapeHtml(it.itg)}</span><b style="color:var(--navy);white-space:nowrap;">${fmtUnit(it.val)}</b></div>`).join('')}
      <div style="display:flex;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:800;padding:6px 0 2px;margin-top:4px;border-top:1.5px solid var(--border);"><span>Total Reward</span><b style="color:var(--navy);white-space:nowrap;">${fmtUnit(total)}</b></div>
    </div>
  </div>`;
}

function saveReward() {
  const o = filteredOutlets[currentIdx];
  if (!o) return;
  const cfg = {};
  document.querySelectorAll('#rewardTableBody tr').forEach(tr => {
    const itg = tr.getAttribute('data-itg');
    if (!itg) return;
    const pctEl = tr.querySelector('.rw-pct');
    const periodeEl = tr.querySelector('.rw-periode');
    const pct = pctEl ? (pctEl.value || '') : '';

// ── Shared Chart.js config for the "Performa Metrik" horizontal bar chart ──
// Reused by the live detail view and by the offscreen print report (opts.animation lets
// the print copy render synchronously so html2canvas captures it fully painted).
function buildMetricsChartConfig(o, opts={}) {
  const gapPos = o.dGapMTD >= 0;
  const labels  = ['Max', '3LM', 'LY', 'LM', 'T.MTD', 'BE MTD', 'A.MTD', 'Gap MTD'];
  const values  = [o.dMax, o.d3LM, o.dLY, o.dLM, o.dTMTD, o.dBEMTD, o.dAMTD, o.dGapMTD];
  const colors  = [
    '#94a3b8', // Max  - gray
    '#7dd3fc', // 3LM  - light blue
    '#a78bfa', // LY   - purple
    '#5eead4', // LM   - teal
    '#fdba74', // T.MTD- orange (target)
    '#fcd34d', // BE MTD - yellow
    '#1d3a8a', // A.MTD- navy (actual, highlighted)
    gapPos ? '#22c55e' : '#e8392a', // Gap - green/red
  ];

  return {
    type: 'bar',
    data: {
      labels,
      datasets: [{
        data: values,
        backgroundColor: colors,
        borderRadius: 4,
        borderSkipped: false,
      }]
    },
    options: {
      indexAxis: 'y',
      responsive: true,
      maintainAspectRatio: false,
      animation: opts.animation !== undefined ? opts.animation : true,
      layout: { padding: { right: 55 } },
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: ctx => (ctx.raw < 0 ? '-' : '') + fmtRp(ctx.raw)
          }
        }
      },
      scales: {
        x: {
          ticks: { font:{ size:8 }, callback: v => fmtRp(v) },
          grid: { color:'#f1f5f9' }
        },
        y: { ticks: { font:{ size:10 }, color:'#1e293b' }, grid: { display:false } }
      }
    },
    plugins: [{
      id: 'valueLabels',
      afterDatasetsDraw(chart) {
        const { ctx, scales: { x, y } } = chart;
        chart.data.datasets[0].data.forEach((val, i) => {
          if (val === 0 || val === null) return;
          const yPos = y.getPixelForValue(i);
          const xPos = x.getPixelForValue(val);
          const label = fmtRp(val);
          ctx.save();
          ctx.font = 'bold 9px Segoe UI, sans-serif';
          ctx.fillStyle = val < 0 ? '#ffffff' : '#1e293b'; // label Gap negatif jatuh di atas bar merah → putih
          ctx.textAlign = 'left';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, xPos + 5, yPos);
          ctx.restore();
        });
      }
    }]
  };
}

function tabClass(itgName) {
  const l = (itgName||'').toLowerCase();
  if (l.includes('itg arjuna') || l.includes('itg a')) return 'prog-tab-itga';
  if (l.includes('itg sc'))   return 'prog-tab-itgsc';
  if (l.includes('lclb'))     return 'prog-tab-lclb';
  if (l.includes('clbk'))     return 'prog-tab-clbk';
  if (l.includes('kantin'))   return 'prog-tab-kantin';
  return 'prog-tab-other';
}

function renderProgContent(o, selectedIdx) {
  const content = document.getElementById('progContent');
  if (!content) return;
  content.innerHTML = programSectionHTML(o, selectedIdx);
}

// Builds the tab-bar + detail-card HTML for one selected program. Reused by the live
// tabbed view (one card at a time) and by the print report (called once per program,
// each with its own index selected, so every program renders as its own full card).
function programSectionHTML(o, selectedIdx) {
  const progs = o.projectArr;

  // Build tabs row
  const tabs = progs.map((p, i) => {
    const cls = tabClass(p['ITG']||'');
    const sel = i === selectedIdx ? ' selected' : '';
    return `<div class="prog-tab ${cls}${sel}" onclick="onProgTabClick(${o.rank-1},${i})">
      <span class="prog-dot"></span>${p['ITG']||'Program'}
    </div>`;
  }).join('');

  const p = progs[selectedIdx];
  const itgLabel  = p['ITG'] || '-';
  const stsITG    = p['Sts ITG'] || itgLabel;
  const isAktif   = (p['Status.1']||'').toLowerCase().includes('aktif');
  const stsCls    = isAktif ? 'sts-active' : 'sts-passive';
  const stsTxt    = p['Status.1'] || '-';

  // Detect ITG SC → use unit formatter, otherwise rupiah
  const isUnit = (itgLabel === 'ITG SC');
  const fmt = isUnit ? fmtUnit : fmtRp;
  const unitNote = isUnit ? ' <span style="font-size:8px;opacity:.6;">(cs/dus)</span>' : '';

  const tMTD  = parseFloat(p['T.MTD']||0);
  const aMTD  = parseFloat(p['A.MTD']||0);
  const tQrt  = parseFloat(p['T.Qrt']||0);
  const aQrt  = parseFloat(p['A.Qrt']||0);
  const achMTD = tMTD > 0 ? Math.round((aMTD/tMTD)*100) : (aMTD > 0 ? 100 : 0);
  const achQrt = tQrt > 0 ? Math.round((aQrt/tQrt)*100) : (aQrt > 0 ? 100 : 0);
  const achMTDCls = achMTD >= 100 ? 'ok' : 'warn';
  const achQrtCls = achQrt >= 100 ? 'ok' : 'warn';

const PROMO_ORDER   = ['Bisc','GEN','SF','GBS','GO','PRE','Solmed'];
const EXCLUDED_PROMO = ['Del'];
const PROMO_COLORS = {
  Bisc:'#1d3a8a', GBS:'#6b21a8', GEN:'#166534',
  GO:'#9a3412',   PRE:'#0c4a6e', SF:'#065f46', Solmed:'#7c2d12'

async function loadSkupelanggan(details) {
  try {
    // Ekstrak unique szEmployeeId dari details yang sudah di-load
    const employeeIds = [...new Set(
      (details || [])
        .map(d => d['szEmployeeId'])
        .filter(id => id && String(id).trim() !== '')
        .map(id => String(id).trim())
    )];

    if (employeeIds.length === 0) {
      console.warn('⚠️ Tidak ada szEmployeeId di details — skip skupelanggan');
      return;
    }

    console.log(`📦 Loading skupelanggan untuk ${employeeIds.length} salesman...`);

    // Fetch semua per-salesman secara paralel
    const results = await Promise.allSettled(
      employeeIds.map(id => cfFetch(`d.skupelanggan.${id}`))
    );

    // Gabungkan semua baris ke skupelMap keyed by Nama_Pelanggan
    let totalRows = 0;
    skupelMap = {};

    results.forEach((result, i) => {
      if (result.status !== 'fulfilled') {
        console.warn(`⚠️ Gagal load skupelanggan.${employeeIds[i]}:`, result.reason?.message);
        return;
      }
      result.value.forEach(r => {
        const nama = (r['Nama_Pelanggan'] || '').trim();
        const sku  = r['SKU'] || r['Cek'] || '';
        if (!nama || !sku) return;
        if (!skupelMap[nama]) skupelMap[nama] = {};
        if (!skupelMap[nama][sku]) {
          skupelMap[nama][sku] = { sku, promo: r['Promo'] || 'Other', plan: 0, mtd: 0 };
        }
        skupelMap[nama][sku].plan += parseFloat(r['Plan']  || 0);
        skupelMap[nama][sku].mtd  += parseFloat(r['UnitMTD'] || 0);
        totalRows++;
      });
    });

    console.log(`✅ Skupelanggan loaded: ${totalRows} rows → ${Object.keys(skupelMap).length} outlets`);

    // Refresh SKU badge outlet yang sedang aktif
    if (filteredOutlets[currentIdx]) renderPlanSKU(filteredOutlets[currentIdx]);

  } catch(e) {
    console.warn('⚠️ loadSkupelanggan error:', e.message);
  }
}

// Groups this outlet's SKU rows by Promo and returns the badge text + each promo
// group's rendered `.sku-group` card (both as a joined `html` string for the live
// "Plan by SKU" panel, which uses CSS multi-column, and as a `groups` array so the
// print report can bin-pack them into fixed columns — see distributeIntoColumns()).
function buildSkuGroupsHTML(o) {
  const skuData = skupelMap[o.nama];
  if (!skuData) {
    return { badgeText: 'tidak ada data', html: '', groups: [], empty: true };
  }

  // Group by Promo
  const byPromo = {};
  Object.values(skuData).forEach(r => {
    if (!byPromo[r.promo]) byPromo[r.promo] = [];
    byPromo[r.promo].push(r);
  });
  Object.values(byPromo).forEach(arr => arr.sort((a,b) => b.plan - a.plan));

  const keys = [
    ...PROMO_ORDER.filter(p => byPromo[p]),
    ...Object.keys(byPromo).filter(p => !PROMO_ORDER.includes(p) && !EXCLUDED_PROMO.includes(p)).sort()
  ].filter(p => !EXCLUDED_PROMO.includes(p));

  const totalSKU = Object.keys(skuData).length;
  const badgeText = `${totalSKU} SKU · ${keys.length} grup`;

  // Format unit (integer with thousand separator)
  const fmt = v => {
    const n = parseFloat(v)||0;
    if (n === 0) return '-';
    return Number.isInteger(n) ? n.toLocaleString('id-ID') : n.toFixed(1);
  };

  const groups = keys.map(promo => {
    const color = PROMO_COLORS[promo] || '#374151';
    const items = byPromo[promo];
    const rows  = items.map(r => {
      const mtdCls = r.mtd === 0 ? 'sku-zero' : r.mtd >= r.plan ? 'sku-ok' : 'sku-warn';
      const planFmt = r.plan > 0 ? fmt(r.plan) : '-';
      const mtdFmt  = r.mtd  > 0 ? fmt(r.mtd)  : '-';
      return `<tr>
        <td>${r.sku}</td>
        <td style="color:var(--muted);">${planFmt}</td>
        <td class="${mtdCls}">${mtdFmt}</td>
      </tr>`;
    }).join('');
    const html = `<div class="sku-group">
      <div class="sku-group-header" style="background:${color};">
        <span>${promo}</span>
        <span style="opacity:.6;font-size:8px;">${items.length} SKU</span>
      </div>
      <table class="sku-tbl">
        <thead><tr><th>SKU</th><th>Plan</th><th>MTD</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
    return { promo, itemCount: items.length, html };
  });

  return { badgeText, html: groups.map(g => g.html).join(''), groups, empty: false };
}

// Bin-packs promo groups into `numCols` columns, biggest-first onto the least-full
// column each time (greedy load balancing) — a deterministic alternative to CSS
// column-count, which can silently overflow a 4th column when groups are uneven
// (see the "Plan by SKU" fix note on .pr-columns above).
function distributeIntoColumns(groups, numCols) {
  const cols = Array.from({ length: numCols }, () => ({ weight: 0, html: '' }));
  [...groups].sort((a, b) => b.itemCount - a.itemCount).forEach(g => {
    const target = cols.reduce((minIdx, c, i) => c.weight < cols[minIdx].weight ? i : minIdx, 0);
    cols[target].html += g.html;
    cols[target].weight += g.itemCount + 1; // +1 = overhead kira-kira utk header grup
  });
  return cols.map(c => c.html);
}

function renderPlanSKU(o) {
  const badge = document.getElementById('skuBadge');
  const body  = document.getElementById('skuBody');
  if (!badge||!body) return;

  const { badgeText, html, empty } = buildSkuGroupsHTML(o);
  badge.textContent = badgeText;
  body.innerHTML = empty
    ? '<p style="font-size:11px;color:var(--muted);padding:10px 0;text-align:center;">Data SKU belum tersedia</p>'
    : `<div class="sku-container">${html}</div>`;
}

// ── Catatan Kunjungan: Digital Signature Pad (2 kanvas: Owner Toko & Petugas/Branch Head) ──
function initSignaturePad(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const dpr  = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width  = Math.max(1, Math.round(rect.width  * dpr));
  canvas.height = Math.max(1, Math.round(rect.height * dpr));

  const ctx = canvas.getContext('2d');
  ctx.scale(dpr, dpr);
  ctx.lineWidth   = 2.2;
  ctx.lineCap     = 'round';
  ctx.lineJoin    = 'round';
  ctx.strokeStyle = '#0f2057';

  // State disimpan langsung pada elemen canvas agar tiap kanvas independen.
  canvas._sig = { ctx, drawing: false, hasContent: false, lastPt: null };

  canvas.onpointerdown   = sigStart;
  canvas.onpointermove   = sigMove;
  canvas.onpointerup     = sigEnd;
  canvas.onpointerleave  = sigEnd;
  canvas.onpointercancel = sigEnd;
}

function initSignaturePads() {
  initSignaturePad('sigCanvasOwner');
  initSignaturePad('sigCanvasPetugas');
  const hint = document.getElementById('vnSavedHint');
  if (hint) hint.style.display = 'none';
}

function getSigDataURL(canvasId) {
  const canvas = document.getElementById(canvasId);
  if (canvas && canvas._sig && canvas._sig.hasContent) return canvas.toDataURL('image/png');
  return null;
}

// Simpan TTD saat ini ke variabel global (agar tidak hilang saat re-render).
function captureCurrentSignatures() {
  const o = getSigDataURL('sigCanvasOwner');
  const p = getSigDataURL('sigCanvasPetugas');
  if (o) sigOwnerData = o;
  if (p) sigPetugasData = p;
}

// Gambar ulang TTD tersimpan ke canvas yang baru dibuat.
function restoreSignature(canvasId, dataUrl) {
  if (!dataUrl) return;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const img = new Image();
  img.onload = () => {
    const dpr = window.devicePixelRatio || 1;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, canvas.width / dpr, canvas.height / dpr);
    if (canvas._sig) canvas._sig.hasContent = true;
    const ph = canvas.parentElement.querySelector('.sig-placeholder');
    if (ph) ph.style.display = 'none';
  };
  img.src = dataUrl;
}

function restoreSavedSignatures() {
  restoreSignature('sigCanvasOwner', sigOwnerData);
  restoreSignature('sigCanvasPetugas', sigPetugasData);
}

function sigPos(e) {
  const rect = e.target.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}
function sigStart(e) {
  e.preventDefault();
  try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
  const st = e.target._sig;
  if (!st) return;
  st.drawing = true;
  st.lastPt = sigPos(e);
  const ph = e.target.parentElement.querySelector('.sig-placeholder');
  if (ph) ph.style.display = 'none';
}
function sigMove(e) {
  const st = e.target._sig;
  if (!st || !st.drawing || !st.ctx) return;
  e.preventDefault();
  const p = sigPos(e);
  st.ctx.beginPath();
  st.ctx.moveTo(st.lastPt.x, st.lastPt.y);
  st.ctx.lineTo(p.x, p.y);
  st.ctx.stroke();
  st.lastPt = p;
  st.hasContent = true;
}
function sigEnd(e) {
  const st = e.target._sig;
  if (st) st.drawing = false;
}
function clearSignature() {
  sigOwnerData = null;
  sigPetugasData = null;
  ['sigCanvasOwner', 'sigCanvasPetugas'].forEach(id => {
    const canvas = document.getElementById(id);
    if (!canvas || !canvas._sig) return;
    const st = canvas._sig;
    const dpr = window.devicePixelRatio || 1;
    st.ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
    st.hasContent = false;
    const ph = canvas.parentElement.querySelector('.sig-placeholder');
    if (ph) ph.style.display = 'block';
  });
  const hint = document.getElementById('vnSavedHint');
  if (hint) hint.style.display = 'none';
}

// Reinit canvas sizing on rotate/resize so it stays crisp on tablets.
// Only reinit while the pads are still empty — avoids wiping signatures already drawn.
let sigResizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(sigResizeTimer);
  sigResizeTimer = setTimeout(() => {
    const empty = (id) => {
      const c = document.getElementById(id);
      return c && (!c._sig || (!c._sig.hasContent && !c._sig.drawing));
    };
    if (empty('sigCanvasOwner') && empty('sigCanvasPetugas')) initSignaturePads();
  }, 250);
});

  // dalam satu kol.3) — lihat catatan "float bersarang" pada .pr-columns di CSS.
  const { badgeText, groups: skuGroups, empty: skuEmpty } = buildSkuGroupsHTML(o);
  const skuLabelHtml = `<div class="pr-section-label">📋 Plan by SKU <span style="font-weight:600;color:var(--muted);font-size:9.5px;">(${badgeText})</span></div>`;
  const skuColsHtml = skuEmpty
    ? `<div class="pr-col" style="margin-right:0;">${skuLabelHtml}<div class="pr-note-box empty">Data SKU belum tersedia</div></div>`
    : distributeIntoColumns(skuGroups, 3)
        .map((colHtml, i) => `<div class="pr-sku-col">${i === 0 ? skuLabelHtml : ''}${colHtml}</div>`)
        .join('');

  // Kolom laporan dibagi eksplisit (bukan CSS column-count — lihat catatan pada .pr-columns):
  // kol.1 = profil + program ke-1 & ke-2, kol.2 = program ke-3 (bila ada) + chart +
  // aktivitas + reward + catatan + ttd, 3 sub-kolom terakhir = Plan by SKU.
  return `
    <div class="pr-titlebar">
      <div class="pr-title">📖 Buku Saku ITG</div>
      <div class="pr-meta">
        Laporan Kunjungan Outlet<br>
        <b>${TODAY.getDate()} ${MONTHS[CUR_MONTH]} ${TODAY.getFullYear()}</b> · ${o.depo}
      </div>
    </div>
    <div class="pr-columns">
      <div class="pr-col">${headerBlock}${programBlocksCol1}</div>
      <div class="pr-col">${programBlocksCol2}${chartBlock}${opsBlock}${rewardBlock}${notesBlock}${sigBlock}</div>
      ${skuColsHtml}
    </div>
  `;
}

let printChart = null;

async function generateFullReportPDF() {
  const o = filteredOutlets[currentIdx];
  if (!o) return;
  if (typeof window.jspdf === 'undefined') {
    alert('Library PDF belum siap dimuat, coba lagi sebentar.');
    return;
  }
  if (typeof html2canvas === 'undefined') {
    alert('Library html2canvas belum siap dimuat, coba lagi sebentar.');
    return;
  }

  const btn = document.querySelector('.vn-btn-primary');
  const originalLabel = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Menyiapkan laporan...'; }

  const page = document.getElementById('printReportPage');

  try {
    const notes   = (document.getElementById('visitNotes')  || {}).value || '';
    const petugas = (document.getElementById('visitPetugas')|| {}).value || '-';
    const tgl     = (document.getElementById('visitDate')   || {}).value || '';
    const sigOwner   = getSigDataURL('sigCanvasOwner');
    const sigPetugas = getSigDataURL('sigCanvasPetugas');

    page.innerHTML = buildPrintReportHTML(o, { notes, petugas, tgl, sigOwner, sigPetugas });

    // Render chart Performa Metrik ke canvas offscreen (animation:false → tergambar langsung)
    if (printChart) { printChart.destroy(); printChart = null; }
    const pCtx = page.querySelector('#metricsChartPrint');
    if (pCtx && typeof Chart !== 'undefined') {
      printChart = new Chart(pCtx, buildMetricsChartConfig(o, { animation:false }));
    }

    // Tunggu 2 frame supaya layout kolom + chart selesai digambar sebelum dipotret
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

    const rect   = page.getBoundingClientRect();
    // width/height/windowWidth/windowHeight dipatok eksplisit supaya html2canvas tidak
    // menebak sendiri area yang ditangkap — sebelumnya (tanpa ini) sisi kanan kadang
    // hilang dari hasil potret walau lebar CSS-nya sendiri sudah benar.
    const canvas = await html2canvas(page, {
      scale: 2,
      useCORS: true,
      backgroundColor: '#ffffff',
      width: Math.ceil(rect.width),
      height: Math.ceil(rect.height),
      windowWidth: Math.ceil(rect.width),
      windowHeight: Math.ceil(rect.height),
    });
    const imgData = canvas.toDataURL('image/png');

    const MM_PER_PX = 25.4 / 96;
    const pageWmm = rect.width  * MM_PER_PX;
    const pageHmm = rect.height * MM_PER_PX;

    const { jsPDF } = window.jspdf;
    // Penting: tentukan orientasi secara eksplisit. Laporan ini "majalah" melebar
    // (landscape), tapi orientasi default jsPDF adalah 'portrait'. Saat diberi
    // `format:[w,h]` dengan w>h, jsPDF akan MENUKAR w & h agar jadi portrait, sehingga
    // halaman PDF jadi portrait (lebih sempit) sedangkan gambar tetap digambar selebar
    // pageWmm — akibatnya sisi kanan gambar (bagian "Plan by SKU") terpotong keluar
    // halaman. Dengan orientasi eksplisit, ukuran halaman = ukuran gambar → tidak ada
    // yang terpotong.
    const orientation = pageWmm >= pageHmm ? 'landscape' : 'portrait';
    const doc = new jsPDF({ unit:'mm', format:[pageWmm, pageHmm], orientation });

    // Pakai ukuran halaman AKTUAL (setelah jsPDF menerapkan orientasi) supaya gambar
    // selalu pas persis dengan halaman, apa pun perilaku internal jsPDF.
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    doc.addImage(imgData, 'PNG', 0, 0, pageW, pageH);

    const safeName = o.nama.replace(/[^a-z0-9]+/gi, '_').slice(0, 40);
    doc.save(`BukuSaku_${safeName}_${tgl || 'draft'}.pdf`);

    const hint = document.getElementById('vnSavedHint');
    if (hint) {
      hint.style.display = 'block';
      clearTimeout(generateFullReportPDF._t);
      generateFullReportPDF._t = setTimeout(() => { hint.style.display = 'none'; }, 3000);
    }
  } catch(err) {
    console.error('generateFullReportPDF error:', err);
    alert('Gagal membuat laporan PDF: ' + err.message);
  } finally {
    if (printChart) { printChart.destroy(); printChart = null; }
    if (page) page.innerHTML = '';
    if (btn) { btn.disabled = false; btn.innerHTML = originalLabel; }
  }
}

function togglePlanSKU() {
  const body  = document.getElementById('skuBody');
  const arrow = document.getElementById('skuArrow');
  if (!body||!arrow) return;
  const open = body.style.display === 'none';
  body.style.display  = open ? 'block' : 'none';
  arrow.textContent   = open ? '▴' : '▾';
}

// Panggil initApp segera atau saat DOM siap
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initApp);
} else {
  initApp();
}
</script>
